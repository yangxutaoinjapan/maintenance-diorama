<!doctype html>
<html lang="{{LANG}}" data-until="{{UNTIL_ISO}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0f1e">
<meta http-equiv="refresh" content="300">
<title>{{TITLE}}</title>
<style>
:root{--ink:#eef2f8;--mute:rgba(214,222,238,.62);--line:rgba(214,222,238,.16);--amber:#ffb547;--bg:#0a0f1e;
  --sans:"Inter","Helvetica Neue",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;--pad:clamp(16px,3.2vw,44px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;display:block;width:100vw;height:100vh;touch-action:none;cursor:grab;opacity:0;transition:opacity 2.4s ease .2s}
canvas:active{cursor:grabbing}
.ready canvas{opacity:1}
/* frame: vignette, soft letterbox, grain -- the diorama sits in a shot, not on a page */
.frame{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(to right,rgba(3,4,10,.74),rgba(3,4,10,.42) 26%,transparent 46%),
    radial-gradient(120% 90% at 60% 44%,transparent 50%,rgba(4,6,14,.55) 80%,rgba(3,4,10,.9) 100%),
    linear-gradient(to bottom,rgba(3,4,10,.78),transparent 16%,transparent 66%,rgba(3,4,10,.88))}
.frame::after{content:"";position:absolute;inset:-50%;background-image:var(--grain);opacity:.55;mix-blend-mode:overlay;animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,3%)}80%{transform:translate(3%,1%)}100%{transform:translate(0,0)}}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;display:grid;grid-template-rows:auto 1fr auto;
  padding:max(var(--pad),env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right)) max(var(--pad),env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left))}
.ui>*{opacity:0;transform:translateY(10px);transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)}
.ready .ui>*{opacity:1;transform:none}
.ready .ui>:nth-child(2){transition-delay:.5s}.ready .ui>:nth-child(3){transition-delay:.9s}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}
.mark{display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;font-weight:600}
.mark b{font-weight:600}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:11px;letter-spacing:.14em;color:var(--mute);background:rgba(10,15,30,.35);backdrop-filter:blur(6px)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 0 rgba(255,181,71,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,181,71,0)}100%{box-shadow:0 0 0 0 rgba(255,181,71,0)}}
.right{display:flex;align-items:center;gap:18px}
.langs{position:relative;pointer-events:auto;font-size:11px;letter-spacing:.12em}
.langs summary{list-style:none;cursor:pointer;color:var(--mute);padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(10,15,30,.35);backdrop-filter:blur(6px)}
.langs summary::-webkit-details-marker{display:none}
.langs summary::after{content:" ▾";opacity:.7}
.langs summary:hover,.langs[open] summary{color:var(--ink)}
.langs ul{position:absolute;right:0;top:calc(100% + 8px);margin:0;padding:6px;list-style:none;min-width:150px;background:rgba(10,15,30,.9);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(10px)}
.langs a{display:block;padding:7px 10px;border-radius:6px;color:var(--mute);text-decoration:none;letter-spacing:.04em}
.langs a:hover,.langs a:focus-visible{color:var(--ink);background:rgba(255,255,255,.06);outline:none}
.langs a[aria-current]{color:var(--amber)}
.time{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.08em;text-align:right}
.time b{color:var(--ink);font-weight:500}
main{align-self:end;max-width:min(680px,92vw);padding-bottom:clamp(14px,2.4vh,28px)}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.24em;white-space:nowrap;text-transform:uppercase;color:var(--amber);margin:0 0 16px}
.eyebrow::before{content:"";width:36px;height:1px;background:var(--amber)}
h1{margin:0;font-weight:300;font-size:clamp(28px,3.4vw,54px);line-height:1.12;letter-spacing:-.01em;white-space:pre-line;text-shadow:0 2px 30px rgba(0,0,0,.5)}
main p{margin:14px 0 0;color:var(--mute);font-size:clamp(13px,1.05vw,15px);line-height:1.75;max-width:46ch}
.eta{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.eta span{display:block;font-size:10px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:5px}
.eta b{font-family:var(--mono);font-weight:500;font-size:15px;color:var(--ink);letter-spacing:.04em}
footer{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:14px}
.svc-label{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
#svc{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 4px}
#svc li{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;transition:background .6s,transform .6s}
#svc svg{width:19px;height:19px;fill:rgba(226,232,244,.5);transition:fill .6s,filter .6s}
#svc-now{color:var(--ink);letter-spacing:.12em;margin-left:10px;text-transform:none}
#svc-now::before{content:"— ";color:var(--mute)}
#svc li.on{background:rgba(255,255,255,.07);transform:translateY(-2px)}
#svc li.on svg{fill:var(--brand);filter:drop-shadow(0 0 6px var(--brand)) brightness(1.35) saturate(1.2)}
.hint{font-size:11px;color:var(--mute);letter-spacing:.08em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.hint i{display:inline-block;width:16px;height:24px;border:1px solid var(--mute);border-radius:8px;position:relative}
.hint i::after{content:"";position:absolute;left:50%;top:5px;width:2px;height:5px;margin-left:-1px;background:var(--mute);border-radius:1px;animation:wheel 1.8s infinite}
@keyframes wheel{to{transform:translateY(7px);opacity:0}}
.no-webgl canvas,.no-webgl .hint{display:none}
.no-webgl .frame{background:radial-gradient(90% 70% at 50% 40%,#17203a,#0a0f1e)}
@media (max-width:720px){
  .time .full{display:none}.mark .chip{display:none}
  h1{font-size:clamp(26px,8vw,36px)}main p{font-size:13px}
  footer{flex-direction:column;align-items:flex-start}.hint{display:none}
  #svc li{width:30px;height:30px}#svc svg{width:15px;height:15px}
  .frame{background:radial-gradient(120% 80% at 50% 30%,transparent 45%,rgba(3,4,10,.8) 100%),linear-gradient(to bottom,rgba(3,4,10,.7),transparent 14%,transparent 40%,rgba(3,4,10,.92) 70%)}
}
@media (max-height:560px) and (min-width:721px){main p{display:none}footer .svc-label{display:none}}
@media (prefers-reduced-motion:reduce){.frame::after,.dot,.hint i::after{animation:none}.ui>*,canvas{transition:none}}
</style>
<script>window.MAINTENANCE={{DATA_JSON}};</script>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="frame" aria-hidden="true"></div>
<div class="ui">
  <header>
    <div class="mark"><b>{{WORDMARK}}</b><span class="chip"><span class="dot"></span>{{STATUS}}</span></div>
    <div class="right">
      <details class="langs"><summary>{{LANG_LABEL}}</summary><ul>{{LANG_LINKS}}</ul></details>
      <div class="time"><span class="full">{{TZ_LABEL}} </span><b id="clock">--:--:--</b></div>
    </div>
  </header>
  <main>
    <p class="eyebrow">{{EYEBROW}}</p>
    <h1>{{HEADLINE}}</h1>
    <p>{{BODY}}</p>
    <div class="eta">
      <div><span>{{ETA_LABEL}}</span><b>{{ETA_VALUE}}</b></div>
      <div><span>{{LEFT_LABEL}}</span><b id="left">—</b></div>
    </div>
  </main>
  <footer>
    <div><p class="svc-label">{{SERVICES}}<span id="svc-now"></span></p><ul id="svc" aria-label="{{SERVICES}}"></ul></div>
    <div class="hint"><i></i>{{HINT}}</div>
  </footer>
</div>
<noscript><style>canvas,.hint{display:none}.ui>*{opacity:1;transform:none}</style></noscript>
<script type="module" src="{{SCENE_SRC}}"></script>
</body>
</html>
