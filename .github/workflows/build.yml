name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the example config: every step below must work without a real site
      - run: npm run build
      - run: npm run typecheck
      - run: npm run preview
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: dist/preview.html
